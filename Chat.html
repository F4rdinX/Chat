<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Link</title>
    <!-- PeerJS CDN for direct browser-to-browser connection -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 88vh; justify-content: space-between; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 10px 14px; border-radius: 8px; font-size: 14px; }
        .chat-box { flex: 1; background: #1e293b; border-radius: 8px; padding: 12px; overflow-y: auto; margin: 10px 0; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 6px; max-width: 85%; word-break: break-all; font-size: 15px; }
        .msg.sent { background: #3b82f6; align-self: flex-end; }
        .msg.received { background: #334155; align-self: flex-start; }
        .input-area { display: flex; gap: 8px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 16px; outline: none; }
        button { padding: 12px 18px; border-radius: 8px; border: none; background: #22c55e; color: white; font-weight: bold; cursor: pointer; font-size: 15px; }
        button:active { background: #16a34a; }
        .status { font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="header">
        <div>Status: <span id="status" style="color: #facc15;">Connecting...</span></div>
        <button onclick="copyMyId()" style="padding: 4px 8px; font-size: 12px; background: #475569;">Copy ID</button>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="msg received">System: Connection starting...</div>
    </div>

    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Type text or OTP..." autocomplete="off">
        <button onclick="sendText()">Send</button>
    </div>

    <script>
        // ইউনিক আইডি জেনারেট বা ফিক্সড রাখার লজিক
        // আপনি চাইলে নিজের জন্য 'fardin-primary' এবং তার জন্য 'other-device' আইডি ফিক্সড করে দিতে পারেন
        const myPeerId = prompt("Enter your ID (e.g., 'fardin' or 'guest'):", "fardin");
        const peer = new Peer(myPeerId);
        let conn = null;

        const statusEl = document.getElementById('status');
        const chatBox = document.getElementById('chatBox');
        const input = document.getElementById('messageInput');

        peer.on('open', (id) => {
            statusEl.innerText = `Ready (ID: ${id})`;
            statusEl.style.color = '#22c55e';
            
            // অটো কানেক্ট করার অপশন
            let targetId = prompt("Enter peer's ID to connect:", myPeerId === 'fardin' ? 'guest' : 'fardin');
            if(targetId) connectToPeer(targetId);
        });

        function connectToPeer(id) {
            statusEl.innerText = `Connecting to ${id}...`;
            conn = peer.connect(id);
            
            conn.on('open', () => {
                statusEl.innerText = `Connected with ${id}`;
                statusEl.style.color = '#22c55e';
            });
            
            conn.on('data', (data) => {
                appendMsg(data, 'received');
            });
        }

        peer.on('connection', (c) => {
            conn = c;
            statusEl.innerText = `Connected with ${conn.peer}`;
            statusEl.style.color = '#22c55e';
            
            conn.on('data', (data) => {
                appendMsg(data, 'received');
            });
        });

        function sendText() {
            const text = input.value.trim();
            if(!text) return;
            
            if(conn && conn.open) {
                conn.send(text);
                appendMsg(text, 'sent');
                input.value = '';
            } else {
                alert("Not connected to anyone yet!");
            }
        }

        function appendMsg(text, type) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        input.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') sendText();
        });

        function copyMyId() {
            navigator.clipboard.writeText(peer.id);
            alert("ID Copied: " + peer.id);
        }
    </script>
</body>
</html>
